services:
  postgres:
    image: postgres:16-alpine
    container_name: ibbf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ibbf
    ports:
      - "5432:5432"
    volumes:
      - ibbf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ibbf"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ibbf_postgres_data:
